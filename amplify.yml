version: 1
# C's backend is deployed separately. Hosting retrieves its existing outputs.
backend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm install --global npm@11.13.0
    build:
      commands:
        - npm ci --include=dev
        - npx ampx generate outputs --app-id "$AWS_APP_ID" --branch "$AWS_BRANCH"
frontend:
  phases:
    build:
      commands:
        - npm run frontend:build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
