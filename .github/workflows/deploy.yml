# B remains a Gen1 control environment during Project5 reference QA.
# CI validates this branch; frontend publication is an explicit verified release.
name: Validate isolated B frontend and backend source
on:
  push:
    branches: [codex/b-frontend-isolation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project5-b-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@11.13.0
      - run: npm ci
      - name: Validate B source and frontend isolation
        run: npm run validate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: project5-b-validation
          path: evidence/synthesis.json
          retention-days: 14
